<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lay Bet Calculator (Styled)</title>
    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
        color: #333;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 1.8em;
      }
      .calculator {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .input-section {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 20px;
      }
      .input-group {
        display: flex;
        flex-direction: column;
      }
      label {
        font-weight: bold;
        font-size: 0.9em;
        margin-bottom: 6px;
      }
      input {
        padding: 10px;
        font-size: 1em;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
      }
      .divider {
        height: 1px;
        background: #ddd;
        margin: 20px 0;
      }
      h2 {
        font-size: 1.3em;
        margin-bottom: 10px;
        text-align: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        border-radius: 6px;
        overflow: hidden;
      }
      th,
      td {
        padding: 12px 10px;
        text-align: center;
        border-bottom: 1px solid #eee;
      }
      th {
        background: #f7f7f7;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 0.85em;
        letter-spacing: 0.5px;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .profit {
        color: #28a745;
        font-weight: bold;
      }
      .loss {
        color: #dc3545;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Lay Bet Calculator</h1>

    <div class="calculator">
      <div class="input-section">
        <div class="input-group">
          <label for="backStake">Back Stake</label>
          <input type="number" id="backStake" value="50" step="0.01" />
        </div>
        <div class="input-group">
          <label for="backOdds">Back Odds</label>
          <input type="number" id="backOdds" value="9" step="0.01" />
        </div>
        <div class="input-group">
          <label for="layOdds">Lay Odds</label>
          <input type="number" id="layOdds" value="10" step="0.01" />
        </div>
        <div class="input-group">
          <label for="commission">Betfair Commission (%)</label>
          <input type="number" id="commission" value="8" step="0.1" />
        </div>
      </div>

      <div class="divider"></div>

      <h2>Normal Stake (Stake Returned)</h2>
      <div id="normalResults"></div>

      <div class="divider"></div>

      <h2>Bonus Bet (Stake Not Returned)</h2>
      <div id="bonusResults"></div>
    </div>

    <script>
      const inputs = document.querySelectorAll(
        "#backStake, #backOdds, #layOdds, #commission"
      );
      const normalResultsDiv = document.getElementById("normalResults");
      const bonusResultsDiv = document.getElementById("bonusResults");

      function formatProfit(value) {
        return `<span class="${
          value >= 0 ? "profit" : "loss"
        }">$${value.toFixed(2)}</span>`;
      }

      function calculate() {
        const backStake = parseFloat(
          document.getElementById("backStake").value
        );
        const backOdds = parseFloat(document.getElementById("backOdds").value);
        const layOdds = parseFloat(document.getElementById("layOdds").value);
        const commission =
          parseFloat(document.getElementById("commission").value) / 100;

        if (
          isNaN(backStake) ||
          isNaN(backOdds) ||
          isNaN(layOdds) ||
          layOdds === 0
        ) {
          normalResultsDiv.innerHTML = "<p>Please enter valid values.</p>";
          bonusResultsDiv.innerHTML = "<p>Please enter valid values.</p>";
          return;
        }

        // Normal Stake
        const layStakeNormal = (backStake * backOdds) / (layOdds - commission);
        const layLiabilityNormal = (layOdds - 1) * layStakeNormal;
        const backProfitNormal =
          backStake * (backOdds - 1) - layLiabilityNormal;
        const layProfitNormal = layStakeNormal * (1 - commission) - backStake;

        normalResultsDiv.innerHTML = `
        <table>
          <tr><th>Type</th><th>Lay Stake</th><th>Lay Liability</th><th>Back Wins</th><th>Lay Wins</th></tr>
          <tr>
            <td>Full Lay</td>
            <td>$${layStakeNormal.toFixed(2)}</td>
            <td>$${layLiabilityNormal.toFixed(2)}</td>
            <td>${formatProfit(backProfitNormal)}</td>
            <td>${formatProfit(layProfitNormal)}</td>
          </tr>
        </table>
      `;

        // Bonus Bet
        const layStakeBonus =
          (backStake * (backOdds - 1)) / (layOdds - commission);
        const layLiabilityBonus = (layOdds - 1) * layStakeBonus;
        const backProfitBonus = backStake * (backOdds - 1) - layLiabilityBonus;
        const layProfitBonus = layStakeBonus * (1 - commission);
        const bonusYieldBack = (backProfitBonus / backStake) * 100;
        const bonusYieldLay = (layProfitBonus / backStake) * 100;

        const manualLayBonus = layStakeBonus * 0.8;
        const manualLayLiabilityBonus = (layOdds - 1) * manualLayBonus;
        const manualBackProfitBonus =
          backStake * (backOdds - 1) - manualLayLiabilityBonus;
        const manualLayProfitBonus = manualLayBonus * (1 - commission);
        const manualBonusYieldBack = (manualBackProfitBonus / backStake) * 100;
        const manualBonusYieldLay = (manualLayProfitBonus / backStake) * 100;

        bonusResultsDiv.innerHTML = `
        <table>
          <tr><th>Type</th><th>Lay Stake</th><th>Lay Liability</th><th>Back Wins</th><th>Lay Wins</th><th>Bonus Turnover (Back)</th><th>Bonus Turnover (Lay)</th></tr>
          <tr>
            <td>Full Lay</td>
            <td>$${layStakeBonus.toFixed(2)}</td>
            <td>$${layLiabilityBonus.toFixed(2)}</td>
            <td>${formatProfit(backProfitBonus)}</td>
            <td>${formatProfit(layProfitBonus)}</td>
            <td>${bonusYieldBack.toFixed(2)}%</td>
            <td>${bonusYieldLay.toFixed(2)}%</td>
          </tr>
          <tr>
            <td>80% Lay</td>
            <td>$${manualLayBonus.toFixed(2)}</td>
            <td>$${manualLayLiabilityBonus.toFixed(2)}</td>
            <td>${formatProfit(manualBackProfitBonus)}</td>
            <td>${formatProfit(manualLayProfitBonus)}</td>
            <td>${manualBonusYieldBack.toFixed(2)}%</td>
            <td>${manualBonusYieldLay.toFixed(2)}%</td>
          </tr>
        </table>
      `;
      }

      inputs.forEach((input) => input.addEventListener("input", calculate));
      calculate();
    </script>
  </body>
</html>
